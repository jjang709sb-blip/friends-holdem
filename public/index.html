let raiseValue=0,raiseMin=0,raiseMax=0,raisePot=0,raiseBet=0;
function clampRaise(v){v=Math.round(Number(v||0)/1000)*1000;return Math.max(raiseMin,Math.min(raiseMax,v))}
function updateRaiseAmount(){if($('raiseAmount'))$('raiseAmount').textContent=fmt(clampRaise(raiseValue||raiseMin))}
function openRaise(){raiseValue=clampRaise(raiseMin);updateRaiseAmount();$('raisePanel').classList.add('show')}
function closeRaise(){$('raisePanel').classList.remove('show')}
function addRaise(n){raiseValue=clampRaise((raiseValue||raiseMin)+n);updateRaiseAmount()}
function setRaisePreset(k){let v=raiseMin;if(k==='half')v=Math.max(raiseMin,state.highest+Math.ceil((raisePot*.5)/1000)*1000);if(k==='pot')v=Math.max(raiseMin,state.highest+Math.ceil(raisePot/1000)*1000);raiseValue=clampRaise(v);updateRaiseAmount()}
function confirmRaise(){let v=clampRaise(raiseValue);act('raise',v);closeRaise()}

setInterval(()=>{if(!state)return;let el=$('turnClock');if(state.turn<0||!state.turnDeadline){el.textContent='';el.className='turnclock';lastSpokenSecond=null;return}let sec=Math.max(0,Math.ceil((state.turnDeadline-Date.now())/1000));let me=state.players[state.turn]?.pid===state.you;if(sec<=5&&sec>=1){el.textContent='⏱ '+sec;el.className='turnclock danger';if(me&&lastSpokenSecond!==sec){lastSpokenSecond=sec;countdownSfx(sec)}}else{el.textContent='';el.className='turnclock';lastSpokenSecond=null}},100);
socket.on('state',s=>{state=s;$('room').textContent=s.code;$('timer').textContent=clock(s.timeLeft);let me=s.players.find(p=>p.pid===s.you),myIndex=s.players.findIndex(p=>p.pid===s.you);$('stack').textContent=fmt(me.stack);$('bank').textContent=fmt(me.bank);$('total').textContent=fmt(me.total);$('pot').textContent='팟 '+fmt(s.pot);let boardKey=(s.board||[]).join('|'),handKey=(me.cards||[]).join('|');if($('board').dataset.cards!==boardKey){$('board').dataset.cards=boardKey;$('board').innerHTML=cardHtml(s.board);if((s.board||[]).length)playFile('deal',.65)}if($('hand').dataset.cards!==handKey){$('hand').dataset.cards=handKey;$('hand').innerHTML=cardHtml(me.cards);if((me.cards||[]).length)playFile('deal',.7)}let pos=[[50,94],[18,83],[7,55],[17,22],[40,7],[67,8],[86,27],[93,58],[81,84]];$('seats').innerHTML=s.players.map((p,i)=>{let rel=(i-myIndex+s.players.length)%s.players.length;return `<div class="seat s${rel} ${p.pid===s.you?'me':''} ${s.turn===i?'turn':''} ${p.connected?'':'off'}">${i===s.button?'<em class="dealer">D</em>':''}<span class="avatar">♠</span><span class="pname">${esc(p.name)}</span>${p.connected?'':' 📵'}<br>${chipStack(p.stack)}<span class="bankmini">잔고 ${fmt(p.bank)}</span><br>${p.fold?'폴드':p.allin?'🔥 올인':p.bet?'베팅 '+fmt(p.bet):''}</div>`}).join('');let mine=s.turn>=0&&s.players[s.turn]?.pid===s.you,call=Math.max(0,s.highest-me.bet);$('turnText').textContent=s.gameOver?'⏰ 게임 종료':s.turn>=0?`${s.players[s.turn].name} 차례`:s.nextHandAt?'다음 핸드 자동 시작':'핸드 대기';$('fold').disabled=!mine;$('check').disabled=!mine||call>0;$('call').disabled=!mine||call===0;$('call').textContent='콜 '+fmt(Math.min(call,me.stack));$('allin').disabled=!mine;$('raiseBtn').disabled=!mine||me.stack<=call;raiseMin=s.highest+s.minRaise;raiseMax=me.stack+me.bet;raisePot=s.pot;raiseBet=me.bet;if(!$('raisePanel').classList.contains('show'))raiseValue=raiseMin;updateRaiseAmount();$('start').style.display='none';$('rebuy').style.display=me.stack===0&&me.bank>0&&['waiting','done'].includes(s.street)&&!s.gameOver?'block':'none';$('log').innerHTML=s.log.map(x=>'<div>'+esc(x)+'</div>').join('');$('log').scrollTop=$('log').scrollHeight;if(mine&&!window.wasMine)sfx('turn');window.wasMine=mine;if(s.lastAction&&s.lastAction.seq>lastActionSeq){lastActionSeq=s.lastAction.seq;sfx(s.lastAction.type)}$('sound').textContent=localStorage.mute==='1'?'🔇':'🔊'});
socket.on('connect',()=>{let code=(new URLSearchParams(location.search).get('room')||'').toUpperCase();if(code){$('code').value=code;let token=localStorage.getItem('holdem_'+code);if(token)socket.emit('resume',{code,token},r=>{if(!r.error)save(r)})}});socket.on('disconnect',()=>$('msg').textContent='연결이 끊겼습니다. 다시 연결되면 자동 복귀합니다.');
</script></body></html>
