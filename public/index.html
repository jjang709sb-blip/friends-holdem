function chipSvg(level=2){

 const stacks=positions.map((x,i)=>{const [top,edge,light]=colors[i],height=2+i%2+(count>=3?1:0),base=46+(i%2)*3;return Array.from({length:height},(_,j)=>{const y=base-j*5;return `<g><path d="M${x-12} ${y}v4c0 7 24 7 24 0v-4Z" fill="${edge}" stroke="${light}" stroke-width=".85"/><path d="M${x-12} ${y+2}l3 1.6m4 .9l3 .6m6 0l3-.6m4-.9l3-1.6" fill="none" stroke="#fff7e3" stroke-width="1.5"/><ellipse cx="${x}" cy="${y}" rx="12" ry="5.6" fill="${top}" stroke="${light}" stroke-width="1.4"/><ellipse cx="${x}" cy="${y}" rx="6.7" ry="2.9" fill="${edge}" opacity=".47" stroke="#fff" stroke-width=".6"/></g>`}).join('')}).join('');

function chipRichness(amount){return amount>=50000?4:amount>=15000?3:amount>=3000?2:1}

function seatElement(pid){return pid===state?.you?document.querySelector('.heroInfo'):[...document.querySelectorAll('.seat:not(.spectatorSeat)')].find(e=>e.dataset.pid===pid)}

function bounds(el,tr){const r=el.getBoundingClientRect();return{x:r.x-tr.x,y:r.y-tr.y,w:r.width,h:r.height}}
function areaOverlap(a,b,g=3){return Math.max(0,Math.min(a.x+a.w+g,b.x+b.w)-Math.max(a.x-g,b.x))*Math.max(0,Math.min(a.y+a.h+g,b.y+b.h)-Math.max(a.y-g,b.y))}
function layoutDecor(){
 if(!state)return;const table=document.querySelector('.table'),tr=table.getBoundingClientRect();if(!tr.width)return;
 const core=[...document.querySelectorAll('.seat:not(.me):not(.spectatorSeat),.seat:not(.me) .seatAction:not(:empty),.revealPortal,.heroDock,#board,#winResult.show')].filter(e=>getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden').map(e=>bounds(e,tr));

  if(getComputedStyle(el).visibility==='hidden')continue;
  const r=bounds(el,tr);if(el.id==='pot'){r.x-=28;r.w+=28}core.push(r);
 }
 const place=(el,pid,obstacles,reaction=false)=>{
  const seat=seatElement(pid);if(!seat)return;const pt=tablePoint(seat);
  let best=null,cost=Infinity;
  el.classList.remove('compact');
  for(let pass=0;pass<2&&!best;pass++){
   if(pass)el.classList.add('compact');
   const w=el.offsetWidth,h=el.offsetHeight;
   const candidates=[];
   for(const radius of [43,61,82,105,130,160])for(let angle=0;angle<360;angle+=30){const a=angle*Math.PI/180;candidates.push([Math.round(pt.x+Math.cos(a)*radius-w/2),Math.round(pt.y+Math.sin(a)*radius-h/2)])}
   for(let y=5;y<=tr.height-h-5;y+=20)for(let x=5;x<=tr.width-w-5;x+=20)candidates.push([x,y]);
   for(const [x,y] of candidates){
   if(x<3||y<3||x+w>tr.width-3||y+h>tr.height-3)continue;

   const c=d+inward*.00007+(outside?36:0);if(c<cost){best=r;cost=c}
   }

}
setInterval(paintTurnBorder,50);

const REACTIONS=[['angry','😡💢','짜증나!'],['yay','🥳✨','아싸!'],['cry','😭','말도 안 돼!'],['laugh','😂','ㅋㅋㅋㅋ'],['pray','🙏','제발…'],['fire','🔥','가즈아!'],['nice','😎','나이스!'],['shock','😱','헐!'],['clap','👏','굿게임!'],['challenge','😏👉','드루와!']];
let reactionNextAt=0,reactionPending=false,lastReactionSeq=0,reactionRoom=null;
function closeReactions(){$('reactionMenu').hidden=true;$('reactionToggle').setAttribute('aria-expanded','false')}
function syncReactionAvailability(){
 const s=fxState.raw,me=s?.players.find(p=>p.pid===s.you),b=$('reactionToggle');
 b.disabled=!s?.features?.reactions||!me||me.spectator||socket.connected===false;
 b.title=!s?.features?.reactions?'서버 업데이트 후 사용할 수 있어요':'리액션';
 if(b.disabled)closeReactions();
 if(reactionRoom!==s?.code){reactionRoom=s?.code;lastReactionSeq=0;reactionNextAt=0;reactionPending=false;}
}
$('reactionToggle').addEventListener('click',()=>{
 const menu=$('reactionMenu'),open=menu.hidden;menu.hidden=!open;$('reactionToggle').setAttribute('aria-expanded',String(open));
 if(open)menu.querySelector('button').focus();
});
$('reactionMenu').innerHTML=REACTIONS.map(([id,emoji,phrase])=>`<button type="button" data-reaction="${id}"><span>${emoji}</span>${phrase}</button>`).join('');
$('reactionMenu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;closeReactions();$('reactionToggle').focus();
 if(reactionPending||Date.now()<reactionNextAt){toast('리액션은 2.6초마다 보낼 수 있어요.');return}
 reactionPending=true;reactionNextAt=Date.now()+2600;
 socket.timeout(4000).emit('reaction',{id:b.dataset.reaction},(err,r)=>{reactionPending=false;if(err){toast('연결을 확인해 주세요.');return}if(r?.error){reactionNextAt=Date.now()+(r.retryAfter||0);toast(r.error)}});
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#reactionMenu,#reactionToggle'))closeReactions();unlockSynth()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReactions()});
socket.on('reaction',event=>{
 if(!fxState.raw||event.code!==fxState.raw.code||event.seq<=lastReactionSeq||Math.abs(Date.now()+serverClockOffset-event.at)>3500)return;
 lastReactionSeq=event.seq;
 const r=REACTIONS.find(x=>x[0]===event.id),p=fxState.raw.players.find(p=>p.pid===event.pid);if(!r||!p||p.spectator)return;
 const old=[...$('reactionLayer').children].find(e=>e.dataset.pid===event.pid);old?.remove();
 const el=document.createElement('div');el.className='seatReaction '+r[0];el.dataset.pid=event.pid;el.innerHTML=`<span>${r[1]}</span><b>${r[2]}</b>`;
 $('reactionLayer').appendChild(el);layoutDecor();
 animateFx(el,[{opacity:0,scale:'.65'},{opacity:1,scale:'1.08',offset:.1},{opacity:1,scale:'1',offset:.2},{opacity:1,scale:'1',offset:.82},{opacity:0,scale:'.9'}],{duration:2500,easing:'ease-out'}).finally(()=>{el.remove();schedulePresentation()});
});

/* New SFX are synthesized locally; existing recorded action voices are preserved. */
let synthContext=null,synthMaster=null,synthElectric=null;const synthNodes=new Set();
function unlockSynth(){
 if(localStorage.mute==='1')return;
 try{if(!synthContext){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;synthContext=new A();synthMaster=synthContext.createGain();synthMaster.gain.value=.48;synthMaster.connect(synthContext.destination);synthElectric=synthContext.createGain();synthElectric.gain.value=.62;const limiter=synthContext.createDynamicsCompressor();limiter.threshold.value=-18;limiter.knee.value=12;limiter.ratio.value=4;limiter.attack.value=.004;limiter.release.value=.16;synthElectric.connect(limiter);limiter.connect(synthContext.destination)}if(synthContext.state==='suspended')synthContext.resume().catch(()=>{})}catch(e){}
}
function stopSynth(){for(const n of synthNodes){try{n.stop()}catch(e){}}synthNodes.clear()}
function audioReady(){return localStorage.mute!=='1'&&synthContext?.state==='running'}
function noiseBurst(at,duration,volume,frequency,q=1,destination=synthMaster){
 const c=synthContext,n=c.createBufferSource(),buffer=c.createBuffer(1,Math.ceil(c.sampleRate*duration),c.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
 n.buffer=buffer;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=frequency;f.Q.value=q;
 const g=c.createGain();g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(volume,at+.003);g.gain.exponentialRampToValueAtTime(.001,at+duration);
 n.connect(f);f.connect(g);g.connect(destination);n.start(at);n.stop(at+duration);synthNodes.add(n);n.onended=()=>{synthNodes.delete(n);n.disconnect();f.disconnect();g.disconnect()};
}
function playElectricClash(){
 if(!audioReady())return;const c=synthContext,t=c.currentTime;
 const hit=t+1.09;
 // Phone speakers reproduce this 1–4 kHz arc more clearly than sub-bass or faint hiss.
 for(let i=0;i<19;i++)noiseBurst(t+.18+i*.044,.075,.16+i*.005,1300+(i%5)*530,.6,synthElectric);
 noiseBurst(hit,.18,.42,2400,.75,synthElectric);noiseBurst(hit+.035,.20,.34,940,.7,synthElectric);
 for(let i=0;i<6;i++)noiseBurst(hit+.16+i*.075,.095,.19-i*.013,1650+(i%3)*600,.8,synthElectric);
 for(const [type,start,end,gain,duration] of [['triangle',290,115,.33,.37],['sine',165,80,.23,.45]]){
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(start,hit);o.frequency.exponentialRampToValueAtTime(end,hit+duration);
  g.gain.setValueAtTime(.001,hit);g.gain.linearRampToValueAtTime(gain,hit+.012);g.gain.exponentialRampToValueAtTime(.001,hit+duration);
  o.connect(g);g.connect(synthElectric);o.start(hit);o.stop(hit+duration);synthNodes.add(o);o.onended=()=>{synthNodes.delete(o);o.disconnect();g.disconnect()};
 }
}
function playChipSound(volume=.5){if(!audioReady())return;const t=synthContext.currentTime;for(let i=0;i<5;i++)noiseBurst(t+i*.028,.031,volume*(.2-i*.023),740+(i%3)*260,1.15)}

function toast(message){$('msg').textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{$('msg').textContent=''},2400)}
