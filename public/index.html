 class="raiseOpen" onclick="openRaise()">레이즈</button><div id="raisePanel" class="raisePanel"><div class="raiseHead"><span>레이즈 총액</span><b id="raiseAmount">0</b><button onclick="closeRaise()">×</button></div><div class="raiseQuick"><button onclick="addRaise(-1000)">−1천</button><button onclick="addRaise(1000)">+1천</button><button onclick="addRaise(2000)">+2천</button><button onclick="addRaise(5000)">+5천</button><button onclick="setRaiseTotal(10000)">1만</button></div><div class="raiseQuick"><button onclick="setRaisePreset('half')">½ 팟</button><button onclick="setRaisePreset('pot')">팟</button><button onclick="setRaisePreset('min')">최소</button><button class="raiseConfirm" onclick="confirmRaise()">레이즈 확정</button></div></div><div id="gameSettings" class="gameSettings" style="display:none"><div class="settingsTitle">⚙️ 방장 게임설정</div><div class="settingRow"><span>게임시간</span><select id="setMinutes" onchange="saveGameSettings()"><option value="20">20분</option><option value="30">30분</option><option value="60">1시간</option><option value="0">제한없음</option></select></div><div class="settingRow"><span>총자산</span><select id="setAssets" onchange="saveGameSettings()"><option value="100000">10만</option><option value="200000">20만</option><option value="250000">25만</option><option value="300000">30만</option></select></div><div class="settingRow"><span>블라인드업</span><select id="setBlindMinutes" onchange="saveGameSettings()"><option value="3">3분</option><option value="4">4분</option><option value="5">5분</option><option value="6">6분</option></select></div></div><button id="start" style="display:none" onclick="socket.emit('start')">게임 시작 / 다음 핸드</button></div><div class="panel"><div class="muted">게임 기록</div><div id="log" class="log"></div></div></div><div id="showdownPanel"></div><div id="finalRanking"></div><div id="turnAlarm"><span class="alarmIcon">⏰</span><b class="alarmNum">5</b></div><div id="myTurnBanner">🔥 내 차례입니다</div><div id="msg"></div></main><script src="/socket.io/socket.io.js"></script
