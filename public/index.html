.mebox{height:67px;min-height:67px;padding:4px 6px!important;position:relative}.balance{position:absolute;left:6px;right:6px;top:3px;justify-content:space-between;font-size:9px}.balance span{text-align:center}.balance b{font-size:12px}.mebox #hand{margin:16px 0 0!important;gap:3px}.mebox #hand .card{width:42px!important;min-width:42px!important;height:57px!important}.mebox #hand .corner{font-size:11px}.mebox #hand .acepip{font-size:27px}#turnText{position:absolute;right:8px;bottom:5px;margin:0;font-size:10px}.turnclock{position:absolute;right:8px;top:22px;font-size:18px!important;margin:0}
.actions{height:94px;min-height:94px;position:relative!important;bottom:auto!important;padding:4px!important;margin:3px 0!important;background:linear-gradient(180deg,#111824f2,#080d14f7)!important;border:1px solid #303b4b!important}.actions .row:first-child{height:39px;gap:4px}.actions .row:first-child button{min-height:0!important;height:39px;padding:5px 2px;font-size:12px}.actions .row:nth-child(2){height:39px;margin-top:4px!important;gap:4px}.actions .row:nth-child(2) input{height:39px;margin:0;padding:5px 8px;font-size:11px}.actions .row:nth-child(2) button{height:39px;min-height:0!important;padding:5px;font-size:12px}.actions #start{position:absolute;left:4px;right:4px;bottom:4px;width:calc(100% - 8px)!important;height:39px;margin:0!important;padding:5px;z-index:5}.actions:has(#start[style*="block"]){height:137px;min-height:137px}
#game>.panel:last-of-type{display:none!important}#msg{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);z-index:100;font-size:10px;pointer-events:none}.rebuy{position:absolute;inset:auto 6px 3px;background:#0b111be8;border-radius:8px;padding:4px;z-index:10}.rebuy p{display:none}.rebuy button{padding:4px 8px}
@media(max-width:430px){main{padding:3px 5px}.table{margin:3px 1px!important}.seat{width:78px!important}.s2{left:7%}.s7{left:93%}}
@media(max-height:760px){.brand{height:29px;min-height:29px}.brand h1{font-size:14px}.top{height:36px;min-height:36px}.mebox{height:60px;min-height:60px}.actions{height:84px;min-height:84px}.actions .row:first-child,.actions .row:first-child button,.actions .row:nth-child(2),.actions .row:nth-child(2) input,.actions .row:nth-child(2) button{height:34px}.card{width:31px!important;min-width:31px!important;height:45px!important}.seat{min-height:43px!important}.seat:before{width:18px!important;height:18px!important}}
</style></head><body><main><div class="brand"><h1>친구들 홀덤 <small style="font:700 9px system-ui;color:#d6b15c">V4.2</small></h1><button id="sound" onclick="toggleSound()">🔊</button></div><div id="lobby" class="panel"><input id="name" maxlength="14" placeholder="닉네임"><button style="width:100%;margin:5px 0" onclick="createRoom()">방 만들기</button><input id="code" maxlength="6" placeholder="초대코드"><button style="width:100%" onclick="joinRoom()">방 입장</button></div><div id="game"><div class="panel top"><div>방 <b id="room"></b><br><button onclick="copyInvite()" style="padding:6px 9px;margin-top:4px">초대링크 복사</button></div><div class="timer" id="timer">60:00</div></div><div class="table"><div id="seats"></div><div class="center"><div class="pot" id="pot">POT 0</div><div class="cards" id="board"></div></div></div><div class="panel mebox"><div class="balance"><span>테이블칩<b id="stack">0</b></span><span>남은 잔고<b id="bank">0</b></span><span>총자산<b id="total">0</b></span></div><div id="hand" class="cards" style="margin:10px"></div><div id="turnText"></div><div id="turnClock" class="turnclock"></div><div id="rebuy" class="rebuy" style="display:none"><p>칩을 모두 잃었습니다. 리바이</p><button onclick="rebuy(20000)">2만</button><button onclick="rebuy(30000)">3만</button><button onclick="rebuy(40000)">4만</button></div></div><div class="actions panel"><div class="row"><button id="fold" onclick="act('fold')">폴드</button><button id="check" onclick="act('check')">체크</button><button id="call" onclick="act('call')">콜</button><button id="allin" onclick="act('allin')">올인</button></div><div class="row" style="margin-top:7px"><input id="raise" type="number" step="1000" placeholder="레이즈 총액"><button id="raiseBtn" onclick="act('raise')">레이즈</button></div><button id="start" style="width:100%;margin-top:7px" onclick="socket.emit('start')">게임 시작 / 다음 핸드</button></div><div class="panel"><div class="muted">게임 기록</div><div id="log" class="log"></div></div></div><div id="msg"></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=x=>document.getElementById(x);let state=null;const sym={S:'♠',H:'♥',D:'♦',C:'♣'},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function cardHtml(a){return(a||[]).map(cardOne).join('')}
function cardOne(c){
 if(!c)return '<div class="card back"></div>';
 const r=c[0]==='T'?'10':c[0], suit=sym[c[1]], red='HD'.includes(c[1]), cls=red?'red':'black';
 const corner=`<span class="corner">${r}<span class="cs">${suit}</span></span><span class="corner bottom">${r}<span class="cs">${suit}</span></span>`;
 if(['J','Q','K'].includes(c[0])){const icon={J:'♞',Q:'♛',K:'♚'}[c[0]];return `<div class="card ${cls}">${corner}<div class="faceart">${icon}<span class="faceSuit">${suit}</span></div></div>`}
 if(c[0]==='A')return `<div class="card ${cls}">${corner}<div class="acepip">${suit}</div></div>`;
 const n=Number(r), cells={2:[2,12],3:[2,7,12],4:[0,4,10,14],5:[0,4,7,10,14],6:[0,4,5,9,10,14],7:[0,4,5,7,9,10,14],8:[0,2,4,5,9,10,12,14],9:[0,2,4,5,7,9,10,12,14],10:[0,2,4,5,6,8,9,10,12,14]}[n]||[];
 return `<div class="card ${cls}">${corner}<div class="pipgrid">${Array.from({length:15},(_,i)=>cells.includes(i)?`<span class="pip ${i>7?'flip':''}">${suit}</span>`:'<span></span>').join('')}</div></div>`
}function save(r){localStorage.setItem('holdem_'+r.code,r.token);history.replaceState(null,'','?room='+r.code);$('lobby').style.display='none';$('game').style.display='block'}function result(r){if(r.error)return $('msg').textContent=r.error;save(r)}function createRoom(){socket.emit('create',{name:$('name').value},result)}function joinRoom(){socket.emit('join',{code:$('code').value,name:$('name').value},result)}function toggleSound(){localStorage.mute=localStorage.mute==='1'?'0':'1';$('sound').textContent=localStorage.mute==='1'?'🔇':'🔊'}function copyInvite(){let u=location.origin+'/?room='+state.code;navigator.clipboard.writeText(u).then(()=>$('msg').textContent='초대 링크 복사 완료').catch(()=>prompt('이 링크를 복사하세요',u))}function act(type){socket.emit('action',{type,amount:Number($('raise').value)},r=>$('msg').textContent=r.error||'')}function rebuy(amount){socket.emit('rebuy',{amount},r=>$('msg').textContent=r.error||'리바이 완료')}
function fmt(n){n=Number(n||0);if(n>=10000){let m=Math.floor(n/10000),t=Math.floor((n%10000)/1000);return m+'만'+(t?' '+t+'천':'')}return n>=1000?Math.floor(n/1000)+'천':String(n)}function chipStack(n){let ten=Math.floor(n/10000),one=Math.floor((n%10000)/1000),bars=Math.max(1,Math.min(6,Math.ceil(n/20000)));return `<span class="chips" title="${n.toLocaleString()}칩"><i style="--h:${bars}"></i><small>${fmt(n)}</small></span>`}let lastSpokenSecond=null,lastActionSeq=0;
const SOUND_FILES={turn:'turn.wav',check:'check.wav',call:'call.wav',raise:'raise.wav',fold:'fold.wav',timeout:'fold.wav',allin:'allin.wav',win:'win.wav',tick:'tick.wav'};
const audioPool={};
function playFile(kind,volume=1){
  if(localStorage.mute==='1')return;
  const file=SOUND_FILES[kind]; if(!file)return;
  try{
    let a=new Audio('/sounds/'+file);
    a.preload='auto'; a.volume=volume;
    a.play().catch(()=>{});
  }catch(e){}
}
function sfx(kind){
  if(kind==='allin'){playFile('allin',1);showAllin();}
  else if(kind==='timeout'){playFile('fold',.9);}
  else playFile(kind,kind==='turn'?.8:1);
}
function countdownSfx(sec){
  if(localStorage.mute==='1')return;
  // 5→1로 갈수록 조금 더 크고 급하게 들리게
  playFile('tick', Math.min(1,.55+(5-sec)*.1));
}
function showAllin(){let d=document.createElement('div');d.className='allinFlash';d.textContent='ALL IN';document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function clock(ms){let s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

setInterval(()=>{if(!state)return;let el=$('turnClock');if(state.turn<0||!state.turnDeadline){el.textContent='';el.className='turnclock';lastSpokenSecond=null;return}let sec=Math.max(0,Math.ceil((state.turnDeadline-Date.now())/1000));let me=state.players[state.turn]?.pid===state.you;if(sec<=5&&sec>=1){el.textContent='⏱ '+sec;el.className='turnclock danger';if(me&&lastSpokenSecond!==sec){lastSpokenSecond=sec;countdownSfx(sec)}}else{el.textContent='';el.className='turnclock';lastSpokenSecond=null}},100);
socket.on('state',s=>{state=s;$('room').textContent=s.code;$('timer').textContent=clock(s.timeLeft);let me=s.players.find(p=>p.pid===s.you),myIndex=s.players.findIndex(p=>p.pid===s.you);$('stack').textContent=fmt(me.stack);$('bank').textContent=fmt(me.bank);$('total').textContent=fmt(me.total);$('pot').textContent='팟 '+fmt(s.pot);$('board').innerHTML=cardHtml(s.board);$('hand').innerHTML=cardHtml(me.cards);let pos=[[50,94],[18,83],[7,55],[17,22],[40,7],[67,8],[86,27],[93,58],[81,84]];$('seats').innerHTML=s.players.map((p,i)=>{let rel=(i-myIndex+s.players.length)%s.players.length;return `<div class="seat s${rel} ${p.pid===s.you?'me':''} ${s.turn===i?'turn':''} ${p.connected?'':'off'}">${i===s.button?'● ':''}${esc(p.name)}${p.connected?'':' 📵'}<br>${chipStack(p.stack)}<span class="bankmini">잔고 ${fmt(p.bank)}</span><br>${p.fold?'폴드':p.allin?'🔥 올인':p.bet?'베팅 '+fmt(p.bet):''}</div>`}).join('');let mine=s.turn>=0&&s.players[s.turn]?.pid===s.you,call=Math.max(0,s.highest-me.bet);$('turnText').textContent=s.gameOver?'⏰ 게임 종료':s.turn>=0?`${s.players[s.turn].name} 차례`:'핸드 대기';$('fold').disabled=!mine;$('check').disabled=!mine||call>0;$('call').disabled=!mine||call===0;$('call').textContent='콜 '+fmt(Math.min(call,me.stack));$('allin').disabled=!mine;$('raiseBtn').disabled=!mine||me.stack<=call;$('raise').min=s.highest+s.minRaise;$('raise').max=me.stack+me.bet;$('raise').placeholder='최소 '+fmt(s.highest+s.minRaise);$('start').style.display=s.you===s.host&&s.canStart?'block':'none';$('rebuy').style.display=me.stack===0&&me.bank>0&&['waiting','done'].includes(s.street)&&!s.gameOver?'block':'none';$('log').innerHTML=s.log.map(x=>'<div>'+esc(x)+'</div>').join('');$('log').scrollTop=$('log').scrollHeight;if(mine&&!window.wasMine)sfx('turn');window.wasMine=mine;if(s.lastAction&&s.lastAction.seq>lastActionSeq){lastActionSeq=s.lastAction.seq;sfx(s.lastAction.type)}$('sound').textContent=localStorage.mute==='1'?'🔇':'🔊'});
socket.on('connect',()=>{let code=(new URLSearchParams(location.search).get('room')||'').toUpperCase();if(code){$('code').value=code;let token=localStorage.getItem('holdem_'+code);if(token)socket.emit('resume',{code,token},r=>{if(!r.error)save(r)})}});socket.on('disconnect',()=>$('msg').textContent='연결이 끊겼습니다. 다시 연결되면 자동 복귀합니다.');
</script></body></html>
