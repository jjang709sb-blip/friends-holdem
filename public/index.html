socket.on('connect',()=>{
  /* V5.59: a temporary Kakao/browser disconnect must resume the same seat.

  if(code&&token){
    socket.emit('resume',{code,token},r=>{
      if(r&&!r.error){save(r);return}
      /* Room/session really disappeared. Fall back to the waiting room, but never create a duplicate seat automatically. */

function updatePresentation(s){
 const n=s.players.filter(p=>!p.spectator).length;
 document.body.classList.toggle('dense-table',n>=7);
 document.body.classList.toggle('has-result',!!s.showdown);
 const me=s.players.find(p=>p.pid===s.you);document.body.classList.toggle('spectator-view',!!me?.spectator);

 if(s.turn<0||s.players[s.turn]?.pid!==s.you)closeRaise();

}
function schedulePresentation(){cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(layoutPresentation)}
function layoutPresentation(){
 const table=document.querySelector('.table');if(!table||!state)return;
 const tr=table.getBoundingClientRect();if(!tr.width||!tr.height)return;
 const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x-tr.x,y:r.y-tr.y,w:r.width,h:r.height}};
 const board=rect($('board')),hero=rect(document.querySelector('.heroDock'));
 const win=$('winResult'),hasResult=win.classList.contains('show');
 // The banner occupies the clear lane above the board, independent of seat height.
 if(hasResult){const h=win.offsetHeight;win.style.top=Math.max(h/2+6,board.y-18-h/2)+'px'}
 const obstacles=[board,...[...document.querySelectorAll('.seat:not(.me):not(.spectatorSeat)')].map(rect)];

  const anchorX=parseFloat(el.style.left)/100*tr.width,anchorY=parseFloat(el.style.top)/100*tr.height;
  const w=el.offsetWidth,h=el.offsetHeight;
  const clamp=(x,y)=>({x:Math.max(4,Math.min(tr.width-w-4,x-w/2)),y:Math.max(4,Math.min(tr.height-h-4,y-h/2)),w,h});
  const candidates=[];
  // Prefer the immediate space below upper seats or above lower seats.

  for(const c of candidates){const cost=obstacles.reduce((a,o)=>a+overlap(c,o)*100,0)+overlap(c,board)*10000+Math.hypot(c.x+w/2-anchorX,c.y+h/2-anchorY);if(cost<bestCost){bestCost=cost;best=c}}
