<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>친구들 홀덤</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;min-height:100vh;padding:10px;background:linear-gradient(#111722,#080b10)}h1{font-size:21px;margin:8px 0 12px}.panel{background:#151b25;border:1px solid #293140;border-radius:14px;padding:12px;margin:8px 0}input,button{font:inherit;border:0;border-radius:10px;padding:11px}input{width:100%;background:#eef1f4;color:#111;margin:5px 0}button{background:#d6a843;color:#17130a;font-weight:800}button:disabled{opacity:.35}.row{display:flex;gap:7px}.row>*{flex:1}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px}.timer{font-size:20px;font-weight:900;color:#ffd15c}.table{position:relative;height:440px;margin:10px 0;border-radius:48%;border:10px solid #5b321d;background:radial-gradient(ellipse,#176b4d 0,#0b4a36 68%,#083526);box-shadow:inset 0 0 35px #001b12,0 5px 20px #000}.seat{position:absolute;width:100px;background:#10141de8;border:1px solid #606a78;border-radius:10px;text-align:center;padding:5px;font-size:11px;transform:translate(-50%,-50%)}.seat.me{border:2px solid #f4c24f}.seat.turn{box-shadow:0 0 0 2px #fff}.seat.off{opacity:.55}.s0{left:50%;top:94%}.s1{left:18%;top:83%}.s2{left:7%;top:55%}.s3{left:17%;top:22%}.s4{left:40%;top:7%}.s5{left:67%;top:8%}.s6{left:86%;top:27%}.s7{left:93%;top:58%}.s8{left:81%;top:84%}.center{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center;width:75%}.pot{font-weight:900;color:#ffd15c;margin:5px}.cards{display:flex;gap:4px;justify-content:center}.card{background:#fff;color:#111;border-radius:6px;min-width:35px;padding:9px 3px;font-size:18px;font-weight:900}.red{color:#d72532}.mebox{text-align:center}.balance{display:flex;justify-content:space-around;font-size:13px}.balance b{display:block;font-size:18px;color:#ffd15c}.actions{position:sticky;bottom:0;background:#0d1118eF;padding:8px 0}.muted{color:#aeb8c7;font-size:12px}.log{max-height:110px;overflow:auto;font-size:12px;line-height:1.6}#game{display:none}#msg{color:#ffbd6b;font-size:13px}.rebuy button{margin:3px}.rank{font-size:11px;color:#c8d0db}.turnclock{font-size:22px;font-weight:1000;color:#ffd15c;margin-top:5px}.turnclock.danger{color:#ff5252;animation:pulse .35s infinite alternate}.allinFlash{position:fixed;inset:0;pointer-events:none;z-index:99;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:1000;color:#fff;text-shadow:0 4px 15px #000;background:#7a000055;animation:allinBoom .45s alternate 6}@keyframes allinBoom{from{opacity:.2;transform:scale(.92)}to{opacity:1;transform:scale(1.05)}}
.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{margin:8px 0}.brand button{background:#202735;color:#fff;padding:7px 10px}.table{height:470px;border:12px solid #6b3d22;box-shadow:inset 0 0 55px #001b12,0 10px 30px #000}.center .cards{min-height:58px}.card{position:relative;min-width:42px;height:58px;padding:6px 4px;border-radius:7px;box-shadow:0 3px 7px #0008;font-size:20px;display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(145deg,#fff,#e9edf2)}.seat{width:108px;min-height:58px;border-radius:13px;background:linear-gradient(#1b2230ee,#0d1118f2);box-shadow:0 4px 12px #0008}.seat.me{border-color:#ffd15c;box-shadow:0 0 0 2px #ffd15c55,0 4px 12px #000}.seat.turn{animation:pulse 1s infinite alternate}.chips{display:flex;align-items:end;justify-content:center;gap:5px;margin-top:3px}.chips i{display:inline-block;width:25px;height:calc(5px + var(--h)*3px);border-radius:50% 50% 4px 4px;background:repeating-linear-gradient(0deg,#e8b83f 0 3px,#7e5415 3px 4px);box-shadow:0 -2px 0 #ffe07b,0 2px 4px #000}.chips small{font-weight:900;color:#ffe078;font-size:12px}.bankmini{display:block;color:#8e9aad;font-size:9px}.pot{font-size:17px;text-shadow:0 2px 5px #000}.actions button{min-height:45px}.actions #allin{background:#c83b3b;color:white}.actions #fold{background:#343c49;color:#fff}@keyframes pulse{from{box-shadow:0 0 0 1px #fff4}to{box-shadow:0 0 16px 4px #ffd15caa}}@media(max-width:430px){main{padding:6px}.table{height:455px}.seat{width:91px;font-size:10px}.s2{left:9%}.s7{left:91%}.card{min-width:38px;height:54px}}
</style></head><body><main><div class="brand"><h1>♠ 친구들 홀덤</h1><button id="sound" onclick="toggleSound()">🔊</button></div><div id="lobby" class="panel"><input id="name" maxlength="14" placeholder="닉네임"><button style="width:100%;margin:5px 0" onclick="createRoom()">방 만들기</button><input id="code" maxlength="6" placeholder="초대코드"><button style="width:100%" onclick="joinRoom()">방 입장</button></div><div id="game"><div class="panel top"><div>방 <b id="room"></b><br><button onclick="copyInvite()" style="padding:6px 9px;margin-top:4px">초대링크 복사</button></div><div class="timer" id="timer">60:00</div></div><div class="table"><div id="seats"></div><div class="center"><div class="pot" id="pot">POT 0</div><div class="cards" id="board"></div></div></div><div class="panel mebox"><div class="balance"><span>테이블칩<b id="stack">0</b></span><span>남은 잔고<b id="bank">0</b></span><span>총자산<b id="total">0</b></span></div><div id="hand" class="cards" style="margin:10px"></div><div id="turnText"></div><div id="turnClock" class="turnclock"></div><div id="rebuy" class="rebuy" style="display:none"><p>칩을 모두 잃었습니다. 리바이</p><button onclick="rebuy(20000)">2만</button><button onclick="rebuy(30000)">3만</button><button onclick="rebuy(40000)">4만</button></div></div><div class="actions panel"><div class="row"><button id="fold" onclick="act('fold')">폴드</button><button id="check" onclick="act('check')">체크</button><button id="call" onclick="act('call')">콜</button><button id="allin" onclick="act('allin')">올인</button></div><div class="row" style="margin-top:7px"><input id="raise" type="number" step="1000" placeholder="레이즈 총액"><button id="raiseBtn" onclick="act('raise')">레이즈</button></div><button id="start" style="width:100%;margin-top:7px" onclick="socket.emit('start')">게임 시작 / 다음 핸드</button></div><div class="panel"><div class="muted">게임 기록</div><div id="log" class="log"></div></div></div><div id="msg"></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=x=>document.getElementById(x);let state=null;const sym={S:'♠',H:'♥',D:'♦',C:'♣'},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function cardHtml(a){return(a||[]).map(c=>`<div class="card ${'HD'.includes(c[1])?'red':''}">${c[0]==='T'?'10':c[0]}${sym[c[1]]}</div>`).join('')}function save(r){localStorage.setItem('holdem_'+r.code,r.token);history.replaceState(null,'','?room='+r.code);$('lobby').style.display='none';$('game').style.display='block'}function result(r){if(r.error)return $('msg').textContent=r.error;save(r)}function createRoom(){socket.emit('create',{name:$('name').value},result)}function joinRoom(){socket.emit('join',{code:$('code').value,name:$('name').value},result)}function toggleSound(){localStorage.mute=localStorage.mute==='1'?'0':'1';$('sound').textContent=localStorage.mute==='1'?'🔇':'🔊'}function copyInvite(){let u=location.origin+'/?room='+state.code;navigator.clipboard.writeText(u).then(()=>$('msg').textContent='초대 링크 복사 완료').catch(()=>prompt('이 링크를 복사하세요',u))}function act(type){socket.emit('action',{type,amount:Number($('raise').value)},r=>$('msg').textContent=r.error||'')}function rebuy(amount){socket.emit('rebuy',{amount},r=>$('msg').textContent=r.error||'리바이 완료')}
function fmt(n){n=Number(n||0);if(n>=10000){let m=Math.floor(n/10000),t=Math.floor((n%10000)/1000);return m+'만'+(t?' '+t+'천':'')}return n>=1000?Math.floor(n/1000)+'천':String(n)}function chipStack(n){let ten=Math.floor(n/10000),one=Math.floor((n%10000)/1000),bars=Math.max(1,Math.min(6,Math.ceil(n/20000)));return `<span class="chips" title="${n.toLocaleString()}칩"><i style="--h:${bars}"></i><small>${fmt(n)}</small></span>`}let audioCtx=null,lastSpokenSecond=null,lastActionSeq=0;
function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,dur=.12,gain=.045,delay=0,type='sine'){if(localStorage.mute==='1')return;try{let a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur)}catch(e){}}
function speak(text,rate=1.15,pitch=.9){if(localStorage.mute==='1'||!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=rate;u.pitch=pitch;u.volume=.9;speechSynthesis.speak(u)}
function sfx(kind){if(localStorage.mute==='1')return;if(kind==='turn'){tone(880,.09,.035);tone(1175,.11,.03,.11)}else if(kind==='check'){speak('체크')}else if(kind==='call'){speak('콜')}else if(kind==='raise'){speak('레이즈')}else if(kind==='fold'||kind==='timeout'){tone(280,.08,.025);tone(180,.12,.025,.08,'triangle');if(kind==='timeout')speak('자동 폴드',1.25)}else if(kind==='allin'){speak('올 인',.92,.72);[0,.48,.96,1.44,1.92].forEach((d,i)=>{tone(i%2?82:70,.32,.12,d,'sine');tone(i%2?123:105,.28,.055,d,'triangle')});showAllin()}else if(kind==='win'){tone(523,.12,.04);tone(659,.12,.04,.13);tone(784,.22,.04,.26)}}
function showAllin(){let d=document.createElement('div');d.className='allinFlash';d.textContent='ALL IN';document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function clock(ms){let s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

setInterval(()=>{if(!state)return;let el=$('turnClock');if(state.turn<0||!state.turnDeadline){el.textContent='';el.className='turnclock';lastSpokenSecond=null;return}let sec=Math.max(0,Math.ceil((state.turnDeadline-Date.now())/1000));el.textContent='⏱ '+sec+'초';el.className='turnclock'+(sec<=5?' danger':'');let me=state.players[state.turn]?.pid===state.you;if(me&&sec<=5&&sec>=1&&lastSpokenSecond!==sec){lastSpokenSecond=sec;speak(String(sec),1.2,1)}if(sec>5)lastSpokenSecond=null},100);
socket.on('state',s=>{state=s;$('room').textContent=s.code;$('timer').textContent=clock(s.timeLeft);let me=s.players.find(p=>p.pid===s.you),myIndex=s.players.findIndex(p=>p.pid===s.you);$('stack').textContent=fmt(me.stack);$('bank').textContent=fmt(me.bank);$('total').textContent=fmt(me.total);$('pot').textContent='팟 '+fmt(s.pot);$('board').innerHTML=cardHtml(s.board);$('hand').innerHTML=cardHtml(me.cards);let pos=[[50,94],[18,83],[7,55],[17,22],[40,7],[67,8],[86,27],[93,58],[81,84]];$('seats').innerHTML=s.players.map((p,i)=>{let rel=(i-myIndex+s.players.length)%s.players.length;return `<div class="seat s${rel} ${p.pid===s.you?'me':''} ${s.turn===i?'turn':''} ${p.connected?'':'off'}">${i===s.button?'● ':''}${esc(p.name)}${p.connected?'':' 📵'}<br>${chipStack(p.stack)}<span class="bankmini">잔고 ${fmt(p.bank)}</span><br>${p.fold?'폴드':p.allin?'🔥 올인':p.bet?'베팅 '+fmt(p.bet):''}</div>`}).join('');let mine=s.turn>=0&&s.players[s.turn]?.pid===s.you,call=Math.max(0,s.highest-me.bet);$('turnText').textContent=s.gameOver?'⏰ 게임 종료':s.turn>=0?`${s.players[s.turn].name} 차례`:'핸드 대기';$('fold').disabled=!mine;$('check').disabled=!mine||call>0;$('call').disabled=!mine||call===0;$('call').textContent='콜 '+fmt(Math.min(call,me.stack));$('allin').disabled=!mine;$('raiseBtn').disabled=!mine||me.stack<=call;$('raise').min=s.highest+s.minRaise;$('raise').max=me.stack+me.bet;$('raise').placeholder='최소 '+fmt(s.highest+s.minRaise);$('start').style.display=s.you===s.host&&s.canStart?'block':'none';$('rebuy').style.display=me.stack===0&&me.bank>0&&['waiting','done'].includes(s.street)&&!s.gameOver?'block':'none';$('log').innerHTML=s.log.map(x=>'<div>'+esc(x)+'</div>').join('');$('log').scrollTop=$('log').scrollHeight;if(mine&&!window.wasMine)sfx('turn');window.wasMine=mine;if(s.lastAction&&s.lastAction.seq>lastActionSeq){lastActionSeq=s.lastAction.seq;sfx(s.lastAction.type)}$('sound').textContent=localStorage.mute==='1'?'🔇':'🔊'});
socket.on('connect',()=>{let code=(new URLSearchParams(location.search).get('room')||'').toUpperCase();if(code){$('code').value=code;let token=localStorage.getItem('holdem_'+code);if(token)socket.emit('resume',{code,token},r=>{if(!r.error)save(r)})}});socket.on('disconnect',()=>$('msg').textContent='연결이 끊겼습니다. 다시 연결되면 자동 복귀합니다.');
</script></body></html>
